<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>
    <linearGradient id="uStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>
    <linearGradient id="nStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#BD00FF"/>
    </linearGradient>
  </defs>

  <!-- Dark Cyber Plate with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shieldBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderCyan)" stroke-width="18"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Bold High-Contrast Monogram U & N -->
  <!-- "U" Stroke -->
  <path d="M 120 140 L 120 280 C 120 370 190 400 256 400 C 322 400 392 370 392 280 L 392 140"
        fill="none" stroke="url(#uStroke)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "N" Overlay Diagonal & Leg -->
  <path d="M 256 396 L 392 140 L 392 380"
        fill="none" stroke="url(#nStroke)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Radar Node Satellite (Online Status) -->
  <circle cx="400" cy="112" r="32" fill="#00FF88"/>
  <circle cx="400" cy="112" r="16" fill="#FFFFFF"/>
</svg>