<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="#080c16" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#cyberGlow)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Stylized Monogram U N -->
  <g filter="url(#neonBlur)">
    <!-- U -->
    <path d="M16 20 V34 C16 41 21 44 26 44 C31 44 36 41 36 34 V20" fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- N Overlay Accent -->
    <path d="M34 44 V20 L48 44 V20" fill="none" stroke="#bd00ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Sensor Reticle Dot -->
  <circle cx="50" cy="14" r="3" fill="#00ff88" />
</svg>
